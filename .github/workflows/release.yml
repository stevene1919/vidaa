name: Create Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Version Match
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          
          echo "Verifying manifest.json version matches tag $TAG_NAME..."
          MANIFEST_VER=$(python3 -c "import json; print(json.load(open('custom_components/vidaa/manifest.json'))['version'])")
          
          if [ "$MANIFEST_VER" != "$VERSION" ]; then
            echo "::error::Version mismatch! manifest.json is '$MANIFEST_VER', but git tag is '$VERSION'."
            exit 1
          fi
          echo "Version match verified: $VERSION"

      - name: Extract Changelog
        id: extract_changelog
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          
          echo "Extracting release notes for version $VERSION..."
          
          # Match ## [VERSION] or ## [vVERSION] followed by any date/header string
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[v?" ver "\\]" { found=1; next }
            found && /^## / { found=0 }
            found { print }
          ' CHANGELOG.md > release_notes.txt
          
          # Check if extracted file has meaningful content (ignoring empty whitespace/newlines)
          if [ ! -s release_notes.txt ] || [ -z "$(tr -d '[:space:]' < release_notes.txt)" ]; then
            echo "No custom release notes found in CHANGELOG.md for $VERSION, using autogenerated notes."
            echo "autogenerate=true" >> $GITHUB_OUTPUT
          else
            echo "Extracted custom release notes successfully."
            echo "autogenerate=false" >> $GITHUB_OUTPUT
          fi

      - name: Package Release Asset
        run: |
          # HACS extracts the release zip straight into custom_components/<domain>/
          # (hacs/integration, repositories/base.py: async_download_zip_file), so the
          # archive must contain the INTEGRATION CONTENT at its root - not the full
          # custom_components/<domain>/ path, which ends up one level too deep after
          # extraction and makes HA report "Integration not found".
          cd custom_components/vidaa
          zip -r "$GITHUB_WORKSPACE/vidaa.zip" . -x "*/__pycache__/*" "*.pyc" "*.orig" "*.bak" ".DS_Store" "*/.DS_Store"
          
          cd "$GITHUB_WORKSPACE"
          SHA256=$(sha256sum vidaa.zip | cut -d ' ' -f 1)
          echo "### Release Asset Checksum" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`vidaa.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`$SHA256\`" >> $GITHUB_STEP_SUMMARY

      - name: Create or Update GitHub Release
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          # Title invariant: release title MUST strictly be just the version tag (e.g. v3.6.0)
          RELEASE_TITLE="v${VERSION}"
          
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" =~ (beta|alpha|rc) ]]; then
            echo "Pre-release tag detected ($TAG_NAME), adding --prerelease flag."
            PRERELEASE_FLAG="--prerelease"
          fi
          
          COMMON_ARGS=("$TAG_NAME" --title "$RELEASE_TITLE")
          if [ -n "$PRERELEASE_FLAG" ]; then
            COMMON_ARGS+=("$PRERELEASE_FLAG")
          fi
          
          if [ "${{ steps.extract_changelog.outputs.autogenerate }}" = "true" ]; then
            NOTES_ARGS=(--generate-notes)
          else
            NOTES_ARGS=(--notes-file release_notes.txt)
          fi
          
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, updating release..."
            gh release edit "${COMMON_ARGS[@]}" "${NOTES_ARGS[@]}"
            gh release upload "$TAG_NAME" vidaa.zip --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "${COMMON_ARGS[@]}" "${NOTES_ARGS[@]}" vidaa.zip
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
